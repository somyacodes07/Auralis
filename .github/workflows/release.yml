name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Version Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verify release tag and source branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          VERSION_FROM_TAG="${TAG_NAME#v}"
          VERSION_FROM_CARGO=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "Release tag: $TAG_NAME (extracted version: $VERSION_FROM_TAG)"
          echo "Cargo manifest version: $VERSION_FROM_CARGO"
          if [[ ! "$VERSION_FROM_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Release tag is not a SemVer version prefixed with 'v'."
            exit 1
          fi
          if [ "$VERSION_FROM_TAG" != "$VERSION_FROM_CARGO" ]; then
            echo "ERROR: Git tag version ($VERSION_FROM_TAG) does not match Cargo.toml version ($VERSION_FROM_CARGO)!"
            exit 1
          fi
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "ERROR: Release tag must point to a commit on the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi
          echo "Version and default-branch source verified successfully."

  build-windows:
    name: Build Windows Release Binary
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --locked

      - name: Build Release Binary
        run: cargo build --workspace --release --locked

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          $assetName = "auralis-$($env:GITHUB_REF_NAME)-windows-x86_64"
          $packageDir = Join-Path "dist" $assetName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/auralis.exe (Join-Path $packageDir "auralis.exe")
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "dist/$($assetName).zip"
          $hash = (Get-FileHash "dist/$($assetName).zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $($assetName).zip" | Out-File -Encoding ascii "dist/$($assetName).zip.sha256"
          Remove-Item -LiteralPath $packageDir -Recurse -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-windows-x86_64
          path: dist/*

  build-macos:
    name: Build macOS Release Binary
    needs: validate-tag
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --locked

      - name: Build Release Binary
        run: cargo build --workspace --release --locked

      - name: Package macOS Artifact
        run: |
          ARCH="$(uname -m)"
          ASSET_NAME="auralis-${GITHUB_REF_NAME}-macos-${ARCH}"
          mkdir -p dist
          cp target/release/auralis "dist/${ASSET_NAME}"
          tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          (cd dist && shasum -a 256 "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256")
          rm "dist/${ASSET_NAME}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-macos
          path: dist/*

  draft-release:
    name: Create Draft Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare Assets
        run: |
          mkdir -p final-dist
          find release-artifacts -type f -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: final-dist/*
          body: |
            ## Auralis Release ${{ github.ref_name }}

            ### Source Commit
            `${{ github.sha }}`

            ### Platform Support Status
            - **Windows (`auralis-${{ github.ref_name }}-windows-x86_64.zip`)**: Native `WorkerW` desktop layering, Media Foundation (`mfplay.dll`) video playback, and the Win32 Configuration Studio UI.
            - **macOS (`auralis-${{ github.ref_name }}-macos-<arch>.tar.gz`)**: CLI diagnostics and video validation only. The macOS desktop wallpaper player and Studio UI are not implemented yet.

            *(See `CHANGELOG.md` for full details and known limitations.)*
