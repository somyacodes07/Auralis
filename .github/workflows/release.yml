name: Release

on:
  push:
    tags:
      - 'v*'
      # Automated main-branch builds (build-release.yml) are published there, not here.
      - '!v*\+build.*'

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Version Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag and source branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          VERSION_FROM_TAG="${TAG_NAME#v}"
          VERSION_FROM_CARGO=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "Release tag: $TAG_NAME (extracted version: $VERSION_FROM_TAG)"
          echo "Cargo manifest version: $VERSION_FROM_CARGO"
          if [[ ! "$VERSION_FROM_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Release tag is not a SemVer version prefixed with 'v'."
            exit 1
          fi
          if [ "$VERSION_FROM_TAG" != "$VERSION_FROM_CARGO" ]; then
            echo "ERROR: Git tag version ($VERSION_FROM_TAG) does not match Cargo.toml version ($VERSION_FROM_CARGO)!"
            exit 1
          fi
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "ERROR: Release tag must point to a commit on the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi
          echo "Version and default-branch source verified successfully."

  package:
    name: Build & Package
    needs: validate-tag
    uses: ./.github/workflows/package.yml
    with:
      asset_label: ${{ github.ref_name }}

  draft-release:
    name: Create Draft Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare Assets
        run: |
          mkdir -p final-dist
          find release-artifacts -type f -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: final-dist/*
          body: |
            ## Auralis Release ${{ github.ref_name }}

            ### Source Commit
            `${{ github.sha }}`

            ### Platform Support Status
            - **Windows (`auralis-${{ github.ref_name }}-windows-x86_64.zip`)**: Native `WorkerW` desktop layering, Media Foundation (`mfplay.dll`) video playback, and the Win32 Configuration Studio UI.
            - **macOS (`auralis-${{ github.ref_name }}-macos-<arch>.app.zip`)**: Menu-bar app using AVFoundation video playback and a native desktop host. The artifact is single-architecture, unsigned, and not notarized. Desktop layering and media playback require manual acceptance testing.
            - The Windows Configuration Studio and in-app preview are not available on macOS.

            *(See `CHANGELOG.md` for full details and known limitations.)*
