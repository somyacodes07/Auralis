name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  hygiene:
    name: Patch & Workspace Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed patch hygiene
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}"
          elif [[ -n "${PUSH_BEFORE:-}" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE" "$GITHUB_SHA"
          else
            git show --check --oneline "$GITHUB_SHA"
          fi

  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks RustSec advisories, the license allow-list, duplicate versions (warn only),
      # and crate sources against deny.toml for the Windows and macOS targets.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features --locked

  windows-build-and-test:
    name: Windows Native Verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --all-features --locked -- --show-output

      - name: Release Build
        run: cargo build --workspace --release --all-features --locked

      - name: Verify executable icon and version information
        shell: pwsh
        run: ./scripts/check-exe-resources.ps1 target/release/auralis.exe

  macos-build-and-test:
    name: macOS Native Verification
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --all-features --locked

      - name: Release Build
        run: cargo build --workspace --release --all-features --locked

  changes:
    name: Detect Docs-Only Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the base branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Docs-only means every changed file is Markdown, under docs/, or under site/.
          # Anything else (code, workflows, assets, installer, license texts) still packages.
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qvE '(\.md$|^docs/|^site/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code or packaging inputs changed: installers will be built."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping installer packaging."
          fi

  package:
    name: Package Installers
    # Proves the Windows zip and macOS DMG still build before merge. Artifacts are attached to
    # the workflow run only; nothing is published. Pushes to main package in build-release.yml.
    # Skipped for docs-only pull requests (see the changes job).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/package.yml
    with:
      asset_label: pr-${{ github.event.pull_request.number }}
