name: Package

# Reusable build: runs every quality gate on native Windows and macOS runners, then packages
# the binaries. Called by release.yml (maintainer tags) and build-release.yml (main builds).

on:
  workflow_call:
    inputs:
      asset_label:
        description: "Version label used in asset file names, e.g. v0.2.0-beta.1 or v0.2.0-beta.1-build.42"
        required: true
        type: string
      build_number:
        description: "Numeric build number stamped into the binary; empty for tag releases"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AURALIS_BUILD_NUMBER: ${{ inputs.build_number }}
      ASSET_LABEL: ${{ inputs.asset_label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features --locked

      - name: Build Release Binary
        run: cargo build --workspace --release --all-features --locked

      - name: Verify executable icon and version information
        shell: pwsh
        run: ./scripts/check-exe-resources.ps1 target/release/auralis.exe

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          $assetName = "auralis-$($env:ASSET_LABEL)-windows-x86_64"
          $packageDir = Join-Path "dist" $assetName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/auralis.exe (Join-Path $packageDir "auralis.exe")
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_LICENSES.md $packageDir
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "dist/$($assetName).zip"
          $hash = (Get-FileHash "dist/$($assetName).zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $($assetName).zip" | Out-File -Encoding ascii "dist/$($assetName).zip.sha256"
          Remove-Item -LiteralPath $packageDir -Recurse -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 6 is not preinstalled on this runner; installing it with Chocolatey."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if (-not $version) { throw "Could not read the package version from Cargo metadata" }
          $baseName = "auralis-$($env:ASSET_LABEL)-windows-x86_64-setup"
          $defines = @("/DAppVersion=$version", "/DOutputBaseName=$baseName")
          if ($env:AURALIS_BUILD_NUMBER) { $defines += "/DBuildNumber=$($env:AURALIS_BUILD_NUMBER)" }
          & $env:ISCC /Qp @defines "/O$(Join-Path $PWD 'dist')" installer\auralis.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash "dist/$baseName.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $baseName.exe" | Out-File -Encoding ascii "dist/$baseName.exe.sha256"
          "INSTALLER=$((Resolve-Path "dist/$baseName.exe").Path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem dist

      - name: Smoke Test Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logDir = Join-Path $env:RUNNER_TEMP "installer-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\Auralis"
          $exe = Join-Path $appDir "auralis.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Auralis.lnk"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $configFile = Join-Path $env:APPDATA "Auralis\auralis_config.json"
          function Get-RunValue { (Get-ItemProperty -Path $runKey -Name Auralis -ErrorAction SilentlyContinue).Auralis }

          if (Test-Path $appDir) { throw "Install directory already exists before the test: $appDir" }

          Write-Host "Silent per-user install with the sign-in task selected"
          $setup = Start-Process -FilePath $env:INSTALLER -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/TASKS=startup",
            "/LOG=`"$(Join-Path $logDir 'install.log')`"")
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }

          foreach ($file in "auralis.exe", "unins000.exe", "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_LICENSES.md") {
            if (-not (Test-Path (Join-Path $appDir $file))) { throw "Missing installed file: $file" }
          }
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing: $shortcut" }
          $expectedRun = "`"$exe`" gui --minimized"
          if ((Get-RunValue) -ne $expectedRun) { throw "Run value is '$(Get-RunValue)', expected '$expectedRun'" }

          & $exe status
          if ($LASTEXITCODE -ne 0) { throw "auralis.exe status exited with code $LASTEXITCODE" }

          # A silent uninstall must keep user settings.
          $createdConfig = $false
          if (-not (Test-Path $configFile)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $configFile) | Out-Null
            Set-Content -Path $configFile -Value "{}" -Encoding ascii
            $createdConfig = $true
          }

          Write-Host "Silent uninstall"
          $uninstall = Start-Process -FilePath (Join-Path $appDir "unins000.exe") -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$(Join-Path $logDir 'uninstall.log')`"")
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          # The uninstaller finishes from a temporary copy of itself; wait for the folder to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $appDir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }

          if (Test-Path $appDir) {
            Get-ChildItem -Recurse $appDir | Format-Table FullName
            throw "Install directory still exists after uninstall: $appDir"
          }
          if (Test-Path $shortcut) { throw "Start menu shortcut still exists after uninstall" }
          if ($null -ne (Get-RunValue)) { throw "Run value still exists after uninstall" }
          if (-not (Test-Path $configFile)) { throw "Silent uninstall deleted the settings file" }
          if ($createdConfig) { Remove-Item -LiteralPath $configFile -Force }
          Write-Host "Installer smoke test passed."

      - name: Upload Installer Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}/installer-logs
          if-no-files-found: ignore

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      AURALIS_BUILD_NUMBER: ${{ inputs.build_number }}
      ASSET_LABEL: ${{ inputs.asset_label }}
      # Oldest macOS the universal build supports; also passed to the Objective-C bridge.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features --locked

      - name: Build Apple Silicon and Intel Binaries
        run: |
          cargo build --workspace --release --all-features --locked --target aarch64-apple-darwin
          cargo build --workspace --release --all-features --locked --target x86_64-apple-darwin

      - name: Package Universal DMG
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          BUNDLE_BUILD="${AURALIS_BUILD_NUMBER:-0}"
          ASSET_NAME="auralis-${ASSET_LABEL}-macos-universal"
          STAGE="dist/stage"
          APP_ROOT="${STAGE}/Auralis.app"
          mkdir -p "${APP_ROOT}/Contents/MacOS" dist

          # One binary with arm64 and x86_64 slices.
          lipo -create \
            target/aarch64-apple-darwin/release/auralis \
            target/x86_64-apple-darwin/release/auralis \
            -output "${APP_ROOT}/Contents/MacOS/Auralis"
          lipo "${APP_ROOT}/Contents/MacOS/Auralis" -verify_arch arm64 x86_64

          cat > "${APP_ROOT}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.auralis.wallpaper</string>
              <key>CFBundleName</key>
              <string>Auralis</string>
              <key>CFBundleDisplayName</key>
              <string>Auralis</string>
              <key>CFBundleExecutable</key>
              <string>Auralis</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION%%-*}</string>
              <key>CFBundleVersion</key>
              <string>${BUNDLE_BUILD}</string>
              <key>LSMinimumSystemVersion</key>
              <string>${MACOSX_DEPLOYMENT_TARGET}</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "${APP_ROOT}/Contents/Info.plist"

          # Ad-hoc signature only (no Apple Developer ID). This keeps the bundle's code
          # signature consistent on Apple Silicon; Gatekeeper still treats it as unidentified.
          codesign --force --sign - --timestamp=none "${APP_ROOT}"
          codesign --verify --strict "${APP_ROOT}"

          # Drag-to-install disk image: Auralis.app next to an Applications shortcut.
          ln -s /Applications "${STAGE}/Applications"
          hdiutil create -volname "Auralis" -srcfolder "${STAGE}" -fs HFS+ -format UDZO -ov \
            "dist/${ASSET_NAME}.dmg"
          hdiutil verify "dist/${ASSET_NAME}.dmg"
          (cd dist && shasum -a 256 "${ASSET_NAME}.dmg" > "${ASSET_NAME}.dmg.sha256")
          rm -rf "${STAGE}"
          ls -la dist

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-macos
          path: dist/*
          if-no-files-found: error
