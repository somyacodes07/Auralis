name: Package

# Reusable build: runs every quality gate on native Windows and macOS runners, then packages
# the binaries. Called by release.yml (maintainer tags) and build-release.yml (main builds).

on:
  workflow_call:
    inputs:
      asset_label:
        description: "Version label used in asset file names, e.g. v0.2.0-beta.1 or v0.2.0-beta.1-build.42"
        required: true
        type: string
      build_number:
        description: "Numeric build number stamped into the binary; empty for tag releases"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AURALIS_BUILD_NUMBER: ${{ inputs.build_number }}
      ASSET_LABEL: ${{ inputs.asset_label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features --locked

      - name: Build Release Binary
        run: cargo build --workspace --release --all-features --locked

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          $assetName = "auralis-$($env:ASSET_LABEL)-windows-x86_64"
          $packageDir = Join-Path "dist" $assetName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/auralis.exe (Join-Path $packageDir "auralis.exe")
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_LICENSES.md $packageDir
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "dist/$($assetName).zip"
          $hash = (Get-FileHash "dist/$($assetName).zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $($assetName).zip" | Out-File -Encoding ascii "dist/$($assetName).zip.sha256"
          Remove-Item -LiteralPath $packageDir -Recurse -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS App Bundle
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      AURALIS_BUILD_NUMBER: ${{ inputs.build_number }}
      ASSET_LABEL: ${{ inputs.asset_label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features --locked

      - name: Build Release Binary
        run: cargo build --workspace --release --all-features --locked

      - name: Package macOS Artifact
        run: |
          ARCH="$(uname -m)"
          ASSET_NAME="auralis-${ASSET_LABEL}-macos-${ARCH}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          BUNDLE_BUILD="${AURALIS_BUILD_NUMBER:-0}"
          APP_ROOT="dist/Auralis.app"
          mkdir -p "${APP_ROOT}/Contents/MacOS" dist
          cp target/release/auralis "${APP_ROOT}/Contents/MacOS/Auralis"
          cat > "${APP_ROOT}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.auralis.wallpaper</string>
              <key>CFBundleName</key>
              <string>Auralis</string>
              <key>CFBundleExecutable</key>
              <string>Auralis</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION%%-*}</string>
              <key>CFBundleVersion</key>
              <string>${BUNDLE_BUILD}</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "${APP_ROOT}/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "${APP_ROOT}" "dist/${ASSET_NAME}.app.zip"
          cp target/release/auralis "dist/${ASSET_NAME}"
          tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          (cd dist && shasum -a 256 "${ASSET_NAME}.app.zip" > "${ASSET_NAME}.app.zip.sha256")
          (cd dist && shasum -a 256 "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256")
          rm -rf "${APP_ROOT}" "dist/${ASSET_NAME}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-macos
          path: dist/*
          if-no-files-found: error
