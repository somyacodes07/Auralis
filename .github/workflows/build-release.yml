name: Build Release

# Every push to the default branch (normally a merged pull request) is built on native Windows
# and macOS runners and published as a numbered GitHub prerelease.
#
# Tag format: v<Cargo.toml version>+build.<N>, for example v0.2.0-beta.1+build.42.
# <N> is this workflow's run number, so it increases with every build. The "+build.N" part is
# SemVer build metadata: the version itself still matches Cargo.toml exactly.
#
# These are unsigned test builds. Maintainer releases still come from pushing a plain
# v<version> tag, which release.yml turns into a reviewed draft release.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve Build Number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      asset_label: ${{ steps.meta.outputs.asset_label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version and tag
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "ERROR: Numbered builds are only published from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Cargo.toml version '$VERSION' is not SemVer without build metadata."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=v${VERSION}+build.${BUILD_NUMBER}"
            echo "asset_label=v${VERSION}-build.${BUILD_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "Build tag: v${VERSION}+build.${BUILD_NUMBER}"

  package:
    name: Build & Package
    needs: meta
    uses: ./.github/workflows/package.yml
    with:
      asset_label: ${{ needs.meta.outputs.asset_label }}
      build_number: ${{ needs.meta.outputs.build_number }}

  publish:
    name: Publish Numbered Prerelease
    needs: [meta, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare Assets
        run: |
          mkdir -p final-dist
          find release-artifacts -type f -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Auralis ${{ needs.meta.outputs.version }} (build ${{ needs.meta.outputs.build_number }})
          prerelease: true
          make_latest: false
          files: final-dist/*
          fail_on_unmatched_files: true
          body: |
            Automated build **${{ needs.meta.outputs.build_number }}** of Auralis `${{ needs.meta.outputs.version }}`, built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Formatting, Clippy, tests, and release builds passed on native Windows and macOS runners before these files were uploaded. That proves compilation and automated tests only; desktop layering and playback still need manual testing (see `docs/PLATFORM_TEST_MATRIX.md`).

            ### Downloads
            - **Windows x64:** `auralis-${{ needs.meta.outputs.asset_label }}-windows-x86_64.zip`. Unzip and run `auralis.exe`.
            - **macOS:** `auralis-${{ needs.meta.outputs.asset_label }}-macos-<arch>.app.zip` (menu-bar app) and a CLI `.tar.gz`. Single-architecture, unsigned, and not notarized.
            - Each file has a matching `.sha256` checksum.

            This is a test build, not a reviewed release. See `CHANGELOG.md` for changes and known limitations.
