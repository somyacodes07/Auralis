[package]
name = "auralis"
version = "1.0.0-rc.1"
edition = "2021"
authors = ["Somyajeet Singh <ffsomyajeet@gmail.com>"]
description = "Live video wallpapers for Windows and macOS, with native playback behind your desktop icons"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/somyacodes07/Auralis"
homepage = "https://somyacodes07.github.io/Auralis/"
keywords = ["wallpaper", "live-wallpaper", "video", "desktop", "macos"]
categories = ["multimedia::video", "gui"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
