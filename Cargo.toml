[package]
name = "auralis"
version = "0.2.0-beta.1"
edition = "2021"
authors = ["somyacodes07 <ffsomyajeet@gmail.com>"]
description = "A premium, Rust-first live wallpaper application for macOS and Windows"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/somyacodes07/Auralis"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
