[package]
name = "auralis"
version = "0.1.0-alpha.0"
edition = "2021"
authors = ["Auralis Team"]
description = "A premium, Rust-first live wallpaper application for macOS and Windows"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ssgamingop/Auralis"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
